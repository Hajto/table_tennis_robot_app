name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'release' }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          apk_path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias tablebot \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            "$apk_path"

      - name: Rename APK
        run: |
          apk_path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ "${{ github.event_name }}" = "release" ]; then
            name="TableBot ${{ github.event.release.tag_name }}.apk"
          else
            name="TableBot $(git rev-parse --short HEAD).apk"
          fi
          mv "$apk_path" "app/build/outputs/apk/release/$name"

      - name: Upload APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          gh release upload "${{ github.event.release.tag_name }}" "$apk_path" --clobber

      - name: Upload APK as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
